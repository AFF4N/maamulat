<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="640" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3EE"/>
      <stop offset="100%" stop-color="#EAE6DC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="300" rx="20" fill="url(#bg1)"/>

  <!-- iPhone Frame Bottom Section -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="24" width="500" height="252" rx="34" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/>
    <rect x="78" y="32" width="484" height="236" rx="28" fill="#F9F8F5"/>
  </g>

  <!-- App Page Preview Snippet -->
  <rect x="102" y="46" width="436" height="44" rx="12" fill="#EDF3EF" stroke="#CFE0D5"/>
  <circle cx="126" cy="68" r="12" fill="#2D5A43"/>
  <text x="126" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FFFFFF">🌿</text>
  <text x="148" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C2822">Maamulat — Daily Spiritual Sheet</text>
  <text x="148" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4A6B58">Open in Safari to install to Home Screen</text>

  <!-- iOS Safari Floating Address Bar -->
  <g filter="url(#cardShadow)">
    <rect x="98" y="106" width="444" height="44" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1"/>
    <text x="114" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">AA</text>
    <!-- Lock + Domain -->
    <g transform="translate(255, 120)">
      <rect x="0" y="5" width="9" height="7" rx="1.5" fill="#8E8E93"/>
      <path d="M2 5V3.5a2.5 2.5 0 0 1 5 0V5" stroke="#8E8E93" stroke-width="1.4" fill="none"/>
      <text x="15" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#1C1C1E">maamulat.app</text>
    </g>
    <!-- Reload Icon -->
    <path d="M518 122a7 7 0 1 0 2 5" stroke="#1C1C1E" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <path d="M516 118l3 4-4 1" stroke="#1C1C1E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- iOS Safari Bottom Navigation Toolbar -->
  <rect x="78" y="164" width="484" height="104" rx="0" fill="#F9F9FB"/>
  <line x1="78" y1="164" x2="562" y2="164" stroke="#D1D1D6" stroke-width="1"/>

  <!-- Back Button (<) -->
  <path d="M135 194l-9 9 9 9" stroke="#007AFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Forward Button (>) -->
  <path d="M218 194l9 9-9 9" stroke="#C7C7CC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Highlighted Share Button (Center) -->
  <g filter="url(#glow)">
    <circle cx="320" cy="203" r="28" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  </g>
  <!-- Authentic iOS Share Icon (Box + Up Arrow) -->
  <rect x="310" y="198" width="20" height="18" rx="3" stroke="#007AFF" stroke-width="2.2" fill="none"/>
  <path d="M320 206V187" stroke="#007AFF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M315 192l5-5 5 5" stroke="#007AFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bookmarks Icon -->
  <path d="M404 195c0-2 3-3 8-3s8 1 8 3v16c0-1.5-3-2.5-8-2.5s-8 1-8 2.5v-16zm16 0c0-2 3-3 8-3s8 1 8 3v16c0-1.5-3-2.5-8-2.5s-8 1-8 2.5v-16z" stroke="#007AFF" stroke-width="1.8" stroke-linejoin="round" fill="none"/>

  <!-- Tabs Icon -->
  <rect x="498" y="196" width="15" height="15" rx="2.5" stroke="#007AFF" stroke-width="2" fill="none"/>
  <path d="M503 196v-3a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3" stroke="#007AFF" stroke-width="2" fill="none"/>

  <!-- Tap Badge Callout -->
  <rect x="248" y="236" width="144" height="24" rx="12" fill="#065F46"/>
  <text x="320" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1. Tap Share Icon ↑</text>
</svg>

