<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="640" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3EE"/>
      <stop offset="100%" stop-color="#EAE6DC"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <filter id="installGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="340" rx="20" fill="url(#bg4)"/>

  <!-- Chrome Material 3 Dropdown Menu Card -->
  <g filter="url(#dropShadow)">
    <rect x="120" y="18" width="400" height="304" rx="22" fill="#F8FAFD" stroke="#D3DBE5" stroke-width="1.5"/>
  </g>

  <!-- Top Quick Action Bar in Chrome Menu -->
  <rect x="120" y="18" width="400" height="50" rx="22" fill="#EEF3F8"/>
  <path d="M168 43h14M175 36l7 7-7 7" stroke="#444746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M262 35l3 6 6 1-4.5 4.2 1.2 6.3-5.7-3-5.7 3 1.2-6.3L253 42l6-1 3-6z" stroke="#444746" stroke-width="1.8" fill="none"/>
  <path d="M355 36v10m-4-4l4 4 4-4M349 49h12" stroke="#444746" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="445" cy="43" r="8" stroke="#444746" stroke-width="1.8" fill="none"/>
  <text x="445" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#444746">i</text>

  <!-- Row 1: New tab -->
  <rect x="148" y="84" width="18" height="18" rx="4" stroke="#444746" stroke-width="1.8" fill="none"/>
  <path d="M157 89v8M153 93h8" stroke="#444746" stroke-width="1.8" stroke-linecap="round"/>
  <text x="184" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1F1F1F">New tab</text>

  <!-- Row 2: Bookmarks -->
  <path d="M157 124l2.5 5 5.5.8-4 3.8 1 5.4-5-2.6-5 2.6 1-5.4-4-3.8 5.5-.8 2.5-5z" stroke="#444746" stroke-width="1.8" fill="none"/>
  <text x="184" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1F1F1F">Bookmarks</text>

  <!-- Row 3: Share... -->
  <circle cx="161" cy="166" r="2.5" stroke="#444746" stroke-width="1.8"/>
  <circle cx="151" cy="171" r="2.5" stroke="#444746" stroke-width="1.8"/>
  <circle cx="161" cy="176" r="2.5" stroke="#444746" stroke-width="1.8"/>
  <line x1="153" y1="170" x2="159" y2="167" stroke="#444746" stroke-width="1.6"/>
  <line x1="153" y1="172" x2="159" y2="175" stroke="#444746" stroke-width="1.6"/>
  <text x="184" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1F1F1F">Share...</text>

  <line x1="136" y1="194" x2="504" y2="194" stroke="#E0E2E0" stroke-width="1"/>

  <!-- Row 4: Highlighted "Install app / Add to Home screen" -->
  <g filter="url(#installGlow)">
    <rect x="130" y="204" width="380" height="56" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  </g>
  <!-- Phone with Down/Install Arrow Icon -->
  <rect x="148" y="219" width="16" height="26" rx="3" stroke="#065F46" stroke-width="2" fill="none"/>
  <path d="M156 225v9m-3.5-3.5L156 234l3.5-3.5" stroke="#065F46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="184" y="229" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#065F46">Install app</text>
  <text x="184" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#047857">or "Add to Home screen"</text>

  <rect x="404" y="220" width="92" height="24" rx="12" fill="#10B981"/>
  <text x="450" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2. Tap Here</text>

  <!-- Row 5: Desktop site -->
  <rect x="147" y="278" width="18" height="13" rx="2" stroke="#444746" stroke-width="1.8" fill="none"/>
  <line x1="144" y1="294" x2="168" y2="294" stroke="#444746" stroke-width="1.8" stroke-linecap="round"/>
  <text x="184" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#1F1F1F">Desktop site</text>
</svg>

