<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="640" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3EE"/>
      <stop offset="100%" stop-color="#EAE6DC"/>
    </linearGradient>
    <filter id="androidShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <filter id="menuGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="280" rx="20" fill="url(#bg3)"/>

  <!-- Android Phone Top Frame -->
  <g filter="url(#androidShadow)">
    <rect x="70" y="22" width="500" height="236" rx="30" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/>
  </g>

  <!-- Android Status Bar -->
  <text x="104" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#444746">9:00</text>
  <circle cx="320" cy="41" r="6" fill="#1F1F1F"/>
  <text x="510" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#444746">5G 100%</text>

  <!-- Chrome Top Toolbar -->
  <rect x="72" y="56" width="496" height="64" fill="#FFFFFF"/>
  <line x1="72" y1="120" x2="568" y2="120" stroke="#E0E2E0" stroke-width="1"/>

  <!-- Home Icon -->
  <path d="M100 91l10-9 10 9v11a2 2 0 0 1-2 2h-16a2 2 0 0 1-2-2V91z" stroke="#444746" stroke-width="2" fill="none"/>

  <!-- Chrome Pill Address Bar (Omnibox) -->
  <rect x="134" y="68" width="296" height="40" rx="20" fill="#F0F4F9"/>
  <!-- Tune/Site Info Icon -->
  <circle cx="156" cy="84" r="2.2" fill="#444746"/>
  <line x1="150" y1="84" x2="162" y2="84" stroke="#444746" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="152" cy="92" r="2.2" fill="#444746"/>
  <line x1="150" y1="92" x2="162" y2="92" stroke="#444746" stroke-width="1.8" stroke-linecap="round"/>
  <text x="174" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#1F1F1F">maamulat.app</text>

  <!-- Tab Count Square [1] -->
  <rect x="454" y="79" width="20" height="20" rx="5" stroke="#444746" stroke-width="2" fill="none"/>
  <text x="464" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#444746">1</text>

  <!-- Highlighted 3-Dot Menu Icon (⋮) -->
  <g filter="url(#menuGlow)">
    <circle cx="520" cy="88" r="24" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  </g>
  <circle cx="520" cy="80" r="2.4" fill="#065F46"/>
  <circle cx="520" cy="88" r="2.4" fill="#065F46"/>
  <circle cx="520" cy="96" r="2.4" fill="#065F46"/>

  <!-- Callout Label -->
  <rect x="380" y="132" width="166" height="28" rx="14" fill="#065F46"/>
  <text x="463" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1. Tap 3-Dot Menu (⋮) ↑</text>

  <!-- App Page Content Snippet -->
  <rect x="96" y="174" width="448" height="62" rx="14" fill="#F8FAF8" stroke="#DCE5DF"/>
  <circle cx="124" cy="205" r="15" fill="#2D5A43"/>
  <text x="124" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15">🌿</text>
  <text x="150" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1C2822">معمولات | Maamulat</text>
  <text x="150" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5A6E62">Tap the Chrome menu in the top-right corner</text>
</svg>

